version: '3.8'

services:
  audit-dashboard:
    build: .
    container_name: freight_audit_dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    command: python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  audit-api:
    build: .
    container_name: freight_audit_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8000
